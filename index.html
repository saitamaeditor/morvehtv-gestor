<!doctype html>
<html lang="es" data-version="20261106233424">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MorvehTV Gestor</title>
<meta name="theme-color" content="#141414">
<meta name="robots" content="noindex">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<link rel="stylesheet" href="estilos.css?v=20261106233424">
</head>
<body>

<!-- Entrar -->
<section id="vista-entrar" class="entrar" hidden>
  <div class="entrar-fondo" aria-hidden="true"></div>
  <header class="entrar-cab"><div class="marca grande"><b>MORVEHTV</b><em>Gestor</em></div></header>
  <form class="tarjeta-entrar" id="f-entrar" novalidate>
    <h1>Iniciar sesión</h1>
    <p class="sub">Gestiona el contenido de IDrive e2: carpetas, subidas y archivos. Entra con tu cuenta de MorvehTV de administrador.</p>
    <label class="campo"><input id="e-usuario" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder=" "><span>Usuario</span></label>
    <label class="campo"><input id="e-clave" type="password" autocomplete="current-password" placeholder=" "><span>Contraseña</span></label>
    <button class="boton primario ancho" type="submit">Entrar</button>
    <p class="error" id="e-error" role="alert"></p>
  </form>
</section>

<!-- Panel -->
<div id="vista-panel" hidden>
  <header class="barra" id="barra">
    <a class="marca" href="#" id="ir-inicio" title="Inicio"><b>MORVEHTV</b><em>Gestor</em></a>
    <nav id="secciones" aria-label="Secciones"></nav>
    <span class="hueco"></span>
    <a class="enlace-web" id="ir-web" target="_blank" rel="noopener" title="Abrir la web de películas">▶ <span class="txt">Ver MorvehTV</span></a>
    <div class="perfil">
      <button class="perfil-boton" id="perfil" aria-haspopup="true" aria-expanded="false" title="Tu cuenta">
        <span class="avatar" id="avatar">?</span><span class="flecha">▾</span>
      </button>
      <div class="menu-perfil" id="menu-perfil" hidden>
        <div class="menu-yo"><span class="avatar" id="avatar2">?</span><span class="usuario" id="usuario"></span></div>
        <div class="uso" id="uso"></div>
        <div class="extra">
          <button class="menu-item" id="b-papelera">🗑 Papelera</button>
          <button class="menu-item" id="b-registro">📜 Registro</button>
          <button class="menu-item" id="b-colaboradores">👥 Colaboradores</button>
        </div>
        <button class="menu-item salir" id="salir">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="principal" id="principal">
    <section class="cartel" id="cartel">
      <div class="migas" id="migas"></div>
      <span class="sello" id="cartel-sello"><i>M</i><span></span></span>
      <h1 class="cartel-titulo" id="cartel-titulo"></h1>
      <p class="cartel-meta" id="cartel-meta"></p>
      <div class="herramientas">
        <label class="boton blanco"><input type="file" id="elegir" multiple hidden accept="video/*,.mkv,.avi,.ts,.srt,.vtt,.ass,image/*">⬆ Subir archivos</label>
        <button class="boton gris" id="b-titulo">🎬 Añadir título</button>
        <button class="boton redondo" id="b-actualizar" title="Actualizar" aria-label="Actualizar">↻</button>
      </div>
    </section>
    <div class="tabla" id="tabla"></div>
    <div class="seleccion" id="seleccion" hidden>
      <span id="sel-n"></span>
      <button class="boton gris" id="sel-mover">↗ Mover</button>
      <button class="boton peligro lleno" id="sel-borrar">🗑 Borrar</button>
      <button class="boton redondo" id="sel-quitar" title="Quitar la selección" aria-label="Quitar la selección">✕</button>
    </div>
    <div class="soltar" id="soltar"><div>⬆<br>Suelta los archivos para subirlos a<br><b id="soltar-dest"></b></div></div>
  </main>

  <!-- Subidas -->
  <section class="subidas" id="subidas" hidden>
    <header><b id="sub-titulo">Subidas</b><button class="boton redondo fino" id="sub-plegar" title="Plegar">▾</button></header>
    <ul id="sub-lista"></ul>
  </section>
</div>

<!-- Ventanas -->
<div class="avisos" id="avisos"></div>

<script src="config.js?v=20261106233424"></script>
<script src="app.js?v=20261106233424"></script>
</body>
</html>
