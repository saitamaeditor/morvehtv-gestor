<!doctype html>
<html lang="es" data-version="20261109010808">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MorvehTV Cuentas</title>
<meta name="theme-color" content="#101114">
<meta name="robots" content="noindex">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="stylesheet" href="estilos.css?v=20261109010808">
<link rel="stylesheet" href="emby.css?v=20261109010808">
</head>
<body>

<!-- Entrar -->
<section id="vista-entrar" class="entrar" hidden>
  <form class="tarjeta-entrar" id="f-entrar" novalidate>
    <div class="marca grande"><img src="icono.svg" alt=""><b>Morveh<span>TV</span></b><em>Cuentas</em></div>
    <p class="sub">Gestiona las cuentas de tu servidor de Emby: crea, renueva y controla quién entra. Entra con tu cuenta de administrador de MorvehTV.</p>
    <label>Usuario<input id="e-usuario" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label>Contraseña<input id="e-clave" type="password" autocomplete="current-password"></label>
    <button class="boton primario ancho" type="submit">Entrar</button>
    <p class="error" id="e-error" role="alert"></p>
  </form>
</section>

<!-- Panel -->
<div id="vista-panel" hidden>
  <header class="barra">
    <div class="marca"><img src="icono.svg" alt=""><b>Morveh<span>TV</span></b><em>Cuentas</em></div>
    <span class="hueco"></span>
    <span class="usuario" id="usuario"></span>
    <button class="boton fino" id="salir">Salir</button>
  </header>
  <main class="pagina-emby emby" id="emby"></main>
</div>

<div class="avisos" id="avisos"></div>

<script src="config.js?v=20261109010808"></script>
<script src="app.js?v=20261109010808"></script>
</body>
</html>
